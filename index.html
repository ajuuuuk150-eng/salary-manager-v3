<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Tracker Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
<h1>💰 Salary Tracker Pro</h1>
<p id="today"></p>
</header>

<div class="dashboard">

<div class="card saldo">
<h3>Saldo Saat Ini</h3>
<h2 id="saldo">Rp 0</h2>
</div>

<div class="grid">

<div class="card">
<h4>💰 Gaji</h4>
<p id="totalGaji">Rp 0</p>
</div>

<div class="card">
<h4>🕒 Lembur</h4>
<p id="totalLembur">Rp 0</p>
</div>

<div class="card">
<h4>💸 Pengeluaran</h4>
<p id="totalKeluar">Rp 0</p>
</div>

<div class="card">
<h4>🎯 Target</h4>
<p id="target">Rp 0</p>
</div>

</div>

</div>

<main id="content"></main>

<nav class="bottomNav">

<button onclick="showPage('home')">
🏠<br>Home
</button>

<button onclick="showPage('gaji')">
💰<br>Gaji
</button>

<button onclick="showPage('lembur')">
🕒<br>Lembur
</button>

<button onclick="showPage('keluar')">
💸<br>Keluar
</button>

<button onclick="showPage('laporan')">
📊<br>Laporan
</button>

<button onclick="showPage('setting')">
⚙️<br>Setting
</button>

</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module" src="script.js"></script>
  
</body>
</html>
