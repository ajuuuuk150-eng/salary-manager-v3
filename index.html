<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Salary Manager Pro V3</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>💰 Salary Manager Pro</h1>

<p id="today"></p>

<div class="filter">

<label>Bulan</label>

<input type="month" id="filterBulan">

</div>

</header>

<main>

<div class="card saldo">

<h3>Total Saldo</h3>

<h1 id="saldo">Rp0</h1>

</div>

<div class="grid">

<div class="card">

<p>💰 Gaji</p>

<h2 id="gaji">Rp0</h2>

</div>

<div class="card">

<p>🕒 Lembur</p>

<h2 id="lembur">Rp0</h2>

</div>

<div class="card">

<p>💸 Pengeluaran</p>

<h2 id="pengeluaran">Rp0</h2>

</div>

<div class="card">

<p>📊 Transaksi</p>

<h2 id="transaksi">0</h2>

</div>

</div>

<div id="content"></div>

</main>

<nav class="bottom">

<button onclick="menuDashboard()">🏠</button>

<button onclick="menuGaji()">💰</button>

<button onclick="menuLembur()">🕒</button>

<button onclick="menuPengeluaran()">💸</button>

<button onclick="menuLaporan()">📊</button>

<button onclick="menuSetting()">⚙️</button>

</nav>

<script src="script.js"></script>

</body>
</html>
